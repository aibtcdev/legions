[project]
name = 'news-legion'
telemetry = false
cache_dir = './.cache'

[[project.requirements]]
contract_id = 'STV9K21TBFAK4KNRJXF5DFP8N7W46G4V9RJ5XDY2.sbtc-token'

[contracts.news-treasury]
path = 'contracts/news-treasury.clar'
clarity_version = 3
epoch = 3.0

[contracts.news-gov]
path = 'contracts/news-gov.clar'
clarity_version = 3
epoch = 3.0

[contracts.news-treasury-v4]
path = 'contracts/news-treasury-v4.clar'
clarity_version = 3
epoch = 3.0

[contracts.news-gov-v4]
path = 'contracts/news-gov-v4.clar'
clarity_version = 3
epoch = 3.0

# Generated from news-gov-v4.clar by scripts/gen-testnet-gov.mjs. Counts stacks
# blocks with a ~30 min lifecycle for fast testnet iteration. Do not edit by hand.
[contracts.news-gov-v4-testnet]
path = 'contracts/news-gov-v4-testnet.clar'
clarity_version = 3
epoch = 3.0

# v5 = v4 + weight-less sponsor-in deposit + draw raised to 0.05% (5 bp).
[contracts.news-treasury-v5]
path = 'contracts/news-treasury-v5.clar'
clarity_version = 3
epoch = 3.0

[contracts.news-gov-v5]
path = 'contracts/news-gov-v5.clar'
clarity_version = 3
epoch = 3.0

# Generated from news-gov-v5.clar by scripts/gen-testnet-gov.mjs. Do not edit by hand.
[contracts.news-gov-v5-testnet]
path = 'contracts/news-gov-v5-testnet.clar'
clarity_version = 3
epoch = 3.0

# v6 = v5 + vote weight snapshotted as of propose (at-block), veto removed,
# VOTING_QUORUM 15 -> 10, MIN_PARTICIPANTS 2 -> 1, and a required on-chain
# rationale on every vote. The treasury is byte-for-byte v5's behaviour; it is
# redeployed only because set-gov is one-time.
[contracts.news-treasury-v6]
path = 'contracts/news-treasury-v6.clar'
clarity_version = 5
epoch = 3.4

[contracts.news-gov-v6]
path = 'contracts/news-gov-v6.clar'
clarity_version = 5
epoch = 3.4

# Generated from news-gov-v6.clar by scripts/gen-testnet-gov-v6.mjs. Do not edit
# by hand. Separate generator from v5's: v6 has no VETO_WINDOW to substitute.
[contracts.news-gov-v6-testnet]
path = 'contracts/news-gov-v6-testnet.clar'
clarity_version = 5
epoch = 3.4

[repl.analysis]
passes = ['check_checker']
[repl.analysis.check_checker]
strict = false
trusted_sender = false
trusted_caller = false
callee_filter = false
