---
id: 0
name: "Testnet deployment - aibtc.news Legion v5 (news-treasury-v5 + news-gov-v5-testnet)"
network: testnet
stacks-node: "https://api.testnet.hiro.so"
bitcoin-node: "http://blockstack:blockstacksystem@bitcoind.testnet.stacks.co:18332"
plan:
  batches:
    # ---------------------------------------------------------------------
    # Batch 0: publish. Deployer is legion-agent-05 (ST2VN1G6...), the same
    # wallet that holds v3 and v4. The v5 contract NAMES are unused by that
    # principal, so no fresh deployer is needed. If you deploy from a DIFFERENT
    # wallet, replace the address in all THREE places here and put that wallet's
    # mnemonic in settings/Testnet.toml.
    #
    # ORDER MATTERS. news-gov-v5-testnet contains
    # `(contract-call? .news-treasury-v5 ...)` at eight sites, which resolve
    # against the SAME deployer principal, so the treasury must publish first
    # and both must come from this one wallet. There is no settable treasury
    # pointer: gov v5 can never be aimed at a different treasury.
    #
    # v5 STARTS FROM AN EMPTY POOL. It is a new treasury, not a rewire, and no
    # migration from v4 is possible: v4's treasury only pays out through v4's
    # own gov. The v4 pool (29,997,000 sats of testnet faucet sBTC) is being
    # written off deliberately.
    #
    # This deploys the TESTNET timing build (news-gov-v5-testnet.clar, stacks
    # blocks, delay 4 / vote 24 / veto 6 / conclude 12). The mainnet burn-block
    # build (news-gov-v5.clar) is NOT deployed here. Never hand-edit the
    # -testnet file; regenerate it with scripts/gen-testnet-gov.mjs.
    #
    # Clarity 3 / epoch 3.0 is required: the treasury uses `as-contract`, which
    # Clarity 4 renamed. This is also why it cannot go through the aibtc MCP
    # deploy_contract (which pins Clarity 4).
    # ---------------------------------------------------------------------
    - id: 0
      transactions:
        - contract-publish:
            contract-name: news-treasury-v5
            expected-sender: ST2VN1G6EBXPMMAJKCSY1HR50YQCVFSK68KKP9SKW
            cost: 500000
            path: contracts/news-treasury-v5.clar
            anchor-block-only: true
            clarity-version: 3
        - contract-publish:
            contract-name: news-gov-v5-testnet
            expected-sender: ST2VN1G6EBXPMMAJKCSY1HR50YQCVFSK68KKP9SKW
            cost: 900000
            path: contracts/news-gov-v5-testnet.clar
            anchor-block-only: true
            clarity-version: 3
      epoch: "3.0"

    # ---------------------------------------------------------------------
    # Batch 1: one-time wiring. Authorizes news-gov-v5-testnet as the only
    # principal that can move funds out of news-treasury-v5. set-gov is one-shot:
    # a second call returns (err u403).
    #
    # THIS BATCH IS NOW LOAD-BEARING FOR DEPOSITS, not just payouts. Unlike v4,
    # v5's public `sponsor-in` asserts that gov is wired, so sponsorships fail
    # with (err u401) until this lands. That is deliberate: before wiring there
    # is no path out of the treasury at all, so an unwired pool could take
    # sponsor money it could never spend.
    #
    # No set-token step: the sBTC principal is a compiled-in literal in the
    # treasury (the testnet Faktory faucet token STV9K21...). A MAINNET deploy
    # must first swap all four occurrences; tests/news-v5.test.ts pins them
    # together so a partial swap fails the suite.
    # ---------------------------------------------------------------------
    - id: 1
      transactions:
        - contract-call:
            contract-id: ST2VN1G6EBXPMMAJKCSY1HR50YQCVFSK68KKP9SKW.news-treasury-v5
            expected-sender: ST2VN1G6EBXPMMAJKCSY1HR50YQCVFSK68KKP9SKW
            method: set-gov
            parameters:
              - "'ST2VN1G6EBXPMMAJKCSY1HR50YQCVFSK68KKP9SKW.news-gov-v5-testnet"
            cost: 20000
            anchor-block-only: true
      epoch: "3.0"
